[build]
  command = "npm ci && npm run build"
  publish = "dist"

# Same-origin API proxy. status=200 (not a 3xx) makes this a server-side
# rewrite, not a browser redirect -- the browser never sees or connects to
# the Render URL directly. Netlify's edge fetches it and returns the
# response as if it came from this site's own origin, which is what makes
# the session cookie first-party instead of cross-site. This MUST come
# before the /* SPA catch-all below, since redirect rules are evaluated
# top-to-bottom and the catch-all would otherwise swallow /api/* requests
# and serve index.html instead of proxying them.
# 2026-09-17: previous server - https://csf-food-flow-api.onrender.com
[[redirects]]
  from = "/api/*"
  to = "https://csf-api.bravebush-24fde88f.uksouth.azurecontainerapps.io/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"